[package]
name = "simple-memory"
version = "0.6.1"
edition = "2024"
description = "Local single-file SQLite + FTS5 memory store and MCP server for coding agents"
license = "MIT"
readme = "../README.md"
keywords = ["memory", "agents", "sqlite", "fts5", "mcp"]
categories = ["command-line-utilities", "database", "development-tools"]

[lib]
name = "simple_memory"
path = "src/lib.rs"

[[bin]]
name = "sm"
path = "src/main.rs"

[features]
default = []
parity = []

[dependencies]
chrono = "0.4.45"
getrandom = "0.4.3"
indexmap = "2.14.2"
libc = "0.2.191"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled", "functions", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
unicode-normalization = "=0.1.25"
wait-timeout = "0.2.1"
